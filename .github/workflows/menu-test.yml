name: Desktop menu test

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['electron/**', 'src/ui/MenuBar.tsx', 'tests/e2e/**', '.github/workflows/menu-test.yml']

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright@1 --version
      - run: node scripts/build-desktop.mjs
      - name: Real-input menu test (Windows)
        env:
          SCALE: ${{ matrix.scale }}
          OUT: ${{ runner.temp }}/menu-test
        run: npm i --no-save playwright@1 && node tests/e2e/desktop-menu.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-test-windows-${{ matrix.scale }}
          path: ${{ runner.temp }}/menu-test
